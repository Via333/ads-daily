<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>今日审美练习</title>
    <link rel="stylesheet" href="./styles.css?v=20260808-image-fit-1" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="dateLabel">Daily Aesthetic</p>
          <h1 id="pageTitle">今日审美练习</h1>
        </div>
        <div class="toolbar" aria-label="页面操作">
          <button class="icon-button" id="refreshButton" type="button" title="重新抓取今日作品" aria-label="重新抓取今日作品">
            <span aria-hidden="true">↻</span>
          </button>
          <button class="icon-button" id="randomButton" type="button" title="随机练习" aria-label="随机练习">
            <span aria-hidden="true">◈</span>
          </button>
        </div>
      </header>

      <nav class="view-tabs" aria-label="内容日期">
        <button class="view-tab is-active" id="todayButton" type="button">今天</button>
        <button class="view-tab" id="archiveButton" type="button" aria-expanded="false" aria-controls="archivePanel">往期归档</button>
      </nav>

      <section class="archive-panel" id="archivePanel" aria-labelledby="archiveTitle" hidden>
        <div class="archive-heading">
          <div>
            <span class="status-kicker">ARCHIVE</span>
            <h2 id="archiveTitle">往期归档</h2>
          </div>
          <label class="date-picker">
            <span>跳到日期</span>
            <input id="archiveDatePicker" type="date" />
          </label>
        </div>
        <div class="archive-groups" id="archiveGroups"></div>
      </section>

      <nav class="day-navigation" aria-label="前后日期">
        <button class="day-step" id="previousDayButton" type="button" title="前一天" aria-label="前一天">‹</button>
        <div class="day-navigation-copy">
          <span id="viewModeLabel">今日作品</span>
          <strong id="selectedDateLabel"></strong>
        </div>
        <button class="day-step" id="nextDayButton" type="button" title="后一天" aria-label="后一天">›</button>
      </nav>

      <section class="status-panel" aria-live="polite">
        <div>
          <span class="status-kicker">开放馆藏</span>
          <strong id="statusText">准备抓取 10 张高清作品</strong>
        </div>
        <div class="progress-shell" aria-hidden="true">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </section>

      <section class="gallery" id="gallery" aria-label="每日作品"></section>
    </main>

    <template id="workTemplate">
      <article class="work-card">
        <div class="image-wrap">
          <img alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" />
          <div class="type-badge"></div>
        </div>
        <div class="work-copy">
          <div class="meta-row">
            <span class="source-pill"></span>
            <span class="license-text"></span>
          </div>
          <h2></h2>
          <p class="artist-line"></p>
          <div class="swatches" aria-label="画面主色"></div>
          <div class="analysis-grid">
            <section>
              <h3>构图</h3>
              <p data-analysis="composition"></p>
            </section>
            <section>
              <h3>内容</h3>
              <p data-analysis="content"></p>
            </section>
            <section>
              <h3>色彩</h3>
              <p data-analysis="color"></p>
            </section>
            <section class="wide-analysis">
              <h3>信息与含义</h3>
              <p data-analysis="meaning"></p>
            </section>
            <section>
              <h3>练习</h3>
              <p data-analysis="learning"></p>
            </section>
          </div>
          <div class="actions">
            <a class="text-link" data-link="original" target="_blank" rel="noreferrer">高清原图</a>
            <a class="text-link" data-link="source" target="_blank" rel="noreferrer">来源</a>
          </div>
        </div>
      </article>
    </template>

    <script src="./app.js?v=20260808-archive-1"></script>
    <script src="./specific-analysis.js?v=20260702-3"></script>
  </body>
</html>
