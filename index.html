<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=briefs/2026-10-11.html"><title>海外广告与新平台情报 - 2026-10-11</title><p>正在打开 <a href="briefs/2026-10-11.html">2026-10-11《海外广告与新平台情报》</a>。</p><!--
<section><h2>今日总判断</h2><p><span class="tag">推断</span><b>代理式广告的关键不是“自动投放”，而是每一步是否可审计：用了什么商品事实、素材和事件信号。</b>TikTok 已宣布其 MCP 让开发者在广告生态之上构建计划、投放和管理工具；Amazon 则把统一平台更名为 Ads Agent。自动化会放大错误商品信息、错误素材或错误优化目标，故品牌规则、批准卖点和转化定义应成为前置闸门。<span class="src">【来源】<a href="https://newsroom.tiktok.com/tiktok-unveils-ai-powered-updates-for-advertisers-driving-discovery-action-and-measurable-business-outcomes-EU?lang=en-150">TikTok Newsroom｜2026-10-06</a>；<a href="https://advertising.amazon.com/library/news/amazon-ads-agent">Amazon Ads｜2026-09-29</a></span></p></section>
<section><h2>海外重点信号</h2><p><span class="tag">事实</span><b>TikTok：广告工作流开始以 MCP 连接 agent。</b>TikTok 10 月 6 日称，TikTok for Business MCP 基于开放 Model Context Protocol，供开发者创建可计划、发起和管理广告工作的 AI agents；同篇还说明 Search Ads Campaign 可与 Smart+ 自动化结合。公告未列完整市场、账户资格或第三方实现边界，不能推定所有广告主已可接入。<span class="src">【来源】<a href="https://newsroom.tiktok.com/tiktok-unveils-ai-powered-updates-for-advertisers-driving-discovery-action-and-measurable-business-outcomes-EU?lang=en-150">TikTok｜产品公告</a></span></p><p><span class="tag">事实</span><b>Amazon：Ads Agent 以三类活动汇聚 AI-first 购买入口。</b>Amazon 9 月 29 日公告称，广告主提供预算、商品和创意后，系统可计划、执行和持续优化；入口包括 Sponsored ads、Full-Funnel Campaigns、Display/Video/Audio。它是产品公告，不代表广告主可跳过商品、合规与测量审核。<span class="src">【来源】<a href="https://advertising.amazon.com/library/news/amazon-ads-agent">Amazon Ads｜Amazon Ads Agent</a></span></p><p><span class="tag">事实</span><b>Google：AI 搜索广告仍处于新格式测试。</b>Google 称正测试 Gemini 支持的 Conversational Discovery ads 与 Highlighted Answers，均会标记为 Sponsored，并可附独立 AI explainer；Direct Offers 试点支持促销上传，且为 UCP 商家加入 native checkout 集成。<span class="src">【来源】<a href="https://blog.google/products/ads-commerce/google-marketing-live-search-ads/">Google Ads &amp; Commerce｜2026-05-20</a></span></p><p><span class="tag">事实</span><b>测量侧把数据管理和因果实验并置。</b>Google 9 月称将 Data Manager 直接整合进 Google Analytics 与 DV360，并推出跨平台地理因果实验 Meridian GeoX beta。自动化出价可以更快，但增量仍须由独立实验或后端业务数据验证。<span class="src">【来源】<a href="https://blog.google/products/ads-commerce/data-strength-updates/">Google｜data and measurement tools，2026-09-10</a></span></p></section>
<section><h2>新广告平台与 AI 原生广告</h2><p><span class="tag">事实</span><b>“答案”正成为广告资产。</b>Google 新 AI 搜索格式为复杂问题提供产品细节与引导；TikTok 将 agent 接入广告计划与管理。品牌不只要写文案，还要提供可核验的规格、价格、适配关系和限制条件。<span class="src">【来源】<a href="https://blog.google/products/ads-commerce/google-marketing-live-search-ads/">Google｜AI 搜索广告</a>；<a href="https://newsroom.tiktok.com/tiktok-unveils-ai-powered-updates-for-advertisers-driving-discovery-action-and-measurable-business-outcomes-EU?lang=en-150">TikTok｜MCP</a></span></p><p><span class="tag">数据</span><b>AI Max 的平均提升不可直接搬入预算表。</b>Google 称，使用完整 AI Max 套件的非零售广告主平均获得 7% 更多转化或转化价值、同时保持类似 CPA/ROAS；该数字来自 Google internal data，且不等于每个账户的增量。单一来源，需后续验证。<span class="src">【来源】<a href="https://blog.google/products/ads-commerce/dsa-upgrade-to-ai-max-2026/">Google Ads｜DSA upgrade to AI Max</a></span></p><p><span class="tag">事实</span><b>AI 透明度成为交付物。</b>Google 已说明在 Search、YouTube、Discover 的 My Ad Center 加入“How this ad was made”；使用 Google 生成工具的广告会自动获得披露。跨平台素材库应保存生成方式、原始资产和审批记录。<span class="src">【来源】<a href="https://blog.google/products/ads-commerce/google-ads-ai-transparency-labels/">Google Ads｜AI transparency labels，2026-07-09</a></span></p></section>
<section><h2>广告素材与创意资产</h2><p><span class="tag">事实</span><b>工具动态｜TikTok 把 agent、搜索自动化与创意能力放在同一发布中。</b>这使“创意—投放—优化”更连续，但官方公告不等于授权将未经品牌审批的生成物直接扩量。<span class="src">【来源】<a href="https://newsroom.tiktok.com/tiktok-unveils-ai-powered-updates-for-advertisers-driving-discovery-action-and-measurable-business-outcomes-EU?lang=en-150">TikTok｜2026-10-06 公告</a></span></p><p><span class="tag">推断</span><b>格式趋势｜前 3 秒可从制造悬念转为提出可回答的选择题。</b>对高考虑品类可测 A 版 Hook“你在 A 和 B 之间犹豫？”与 B 版 Hook“先看一个决定性规格”；3–8 秒用包装、尺寸、成分或演示作证明点；CTA 直达对应商品页或 FAQ 锚点。这是基于对话式搜索广告的创意推断，并非效果承诺。<span class="src">【来源】<a href="https://blog.google/products/ads-commerce/google-marketing-live-search-ads/">Google｜广告回答特定问题</a></span></p><p><span class="tag">推断</span><b>可执行测试｜只替换一个变量层。</b>同一 SKU 建两条 15 秒片，固定预算、受众、价格、落地页和 CTA，只替换 Hook；胜者再测试证明点（演示 vs. 规格卡）与反对意见处理（兼容/运输/退换）。记录 3 秒观看、完播、商品页停留、加购、支付和退款，并把答案版本写入素材名。<span class="src">【来源】<a href="https://blog.google/products/ads-commerce/data-strength-updates/">Google｜多信号与因果证明</a>；<a href="https://blog.google/products/ads-commerce/google-ads-ai-transparency-labels/">Google｜AI 创意披露</a></span></p></section>
<section><h2>案例深拆｜MAM Baby × Remazing × Amazon Ads</h2><p><span class="tag">事实</span><b>品牌/产品、人群与场景。</b>MAM 为母婴用品品牌；其英国官网列出从 0+ 月到 6+ 月、不同容量与奶嘴流速的奶瓶。Amazon 案例称，MAM 在英国 Prime Day 2026 前围绕出生至 12 个月产品组合焕新，并希望接触尚未发现品牌的新客。品牌页与平台案例构成两类来源交叉验证。<span class="src">【来源】<a href="https://advertising.amazon.com/library/case-studies/mam-and-remazing">Amazon Ads｜MAM 案例</a>；<a href="https://www.mambaby.com/gb/shop/baby-bottles/">MAM Baby UK｜产品页</a></span></p><p><span class="tag">事实</span><b>商业目标、洞察、媒介和转化路径。</b>案例称传统创意制作可能超过三个月、每年拍摄次数有限；团队把 AI 视频与传统片在相同条件、相同预算下做 A/B 测试。媒介为 Prime Video Interactive Video Ads；Sponsored Products、Sponsored Brands 承接下漏斗，再营销触及互动或加购后未购买人群。<span class="src">【来源】<a href="https://advertising.amazon.com/library/case-studies/mam-and-remazing">Amazon Ads｜目标与方法</a></span></p><p><span class="tag">事实</span><b>创意概念与素材拆解：公开可确认流程，不能编造镜头。</b>Remazing 使用 Creative Agent、MAM 品牌资产和产品图，经四轮反馈完善脚本、场景与产品细节。页面未提供可逐帧观看的成片或脚本文字，故首帧/Hook、画面、旁白、产品露出、证明点、CTA、时长和达人角色均未见公开可验证材料；不能写成真实原片。可确认格式为 Prime Video Interactive Video Ads，商品页是承接。<span class="src">【来源】<a href="https://advertising.amazon.com/library/case-studies/mam-and-remazing">Amazon Ads｜创意制作与格式</a>；<a href="https://www.mambaby.com/gb/shop/baby-bottles/">MAM Baby UK｜产品承接</a></span></p><p><span class="tag">数据</span><b>结果信号只能按单一案例口径阅读。</b>Amazon 页面称，AI 视频相对传统创意带来 39% 更多加购、每次加购成本低 28%、首次触点加购转化多 35%，click-through rate 高 38%；脚注为 MAM（英国，2026）。未见独立审计或完整实验细节，单一来源，需后续验证，不应预测其他母婴品牌 ROAS。<span class="src">【来源】<a href="https://advertising.amazon.com/library/case-studies/mam-and-remazing">Amazon Ads｜结果与脚注</a></span></p><p><span class="tag">推断</span><b>可复用打法与风险。</b>用已批准包装、规格和产品图约束生成，先走反馈/法务门，再在同预算下做对照；视频引入、Sponsored 捕获意图、再营销处理犹豫。母婴品类的功效、年龄段、安全与当地监管表述不能由模型补写；跨市场须复核语言、认证、价格和库存。<span class="src">【来源】<a href="https://advertising.amazon.com/library/case-studies/mam-and-remazing">Amazon Ads｜反馈与再营销</a>；<a href="https://www.mambaby.com/gb/shop/baby-bottles/">MAM Baby UK｜年龄/规格</a></span></p></section>
<section><h2>国内打法补充</h2><p><span class="tag">推断</span><b>把“答案资产”迁为抖音/小红书/直播电商的商品解释层。</b>同一经审计问题可拆到短视频首帧、评论置顶、商品卡 FAQ、达人口播和直播切片：一个问题、一条可验证答案、一个对应商品卡。本期未核验国内平台存在同一广告产品或相同效果，不能把建议表述成平台能力。<span class="src">【来源】<a href="https://blog.google/products/ads-commerce/google-marketing-live-search-ads/">Google｜对话式发现广告</a></span></p></section>
<section><h2>今日可执行小实验</h2><p><span class="tag">推断</span><b>实验一｜为 10 个主推 SKU 建答案卡。</b>字段仅含问题、批准答案、证据链接、市场、禁用表述、落地页锚点；客服、创意和媒介共用同一版本。<span class="src">【来源】<a href="https://blog.google/products/ads-commerce/google-ads-ai-transparency-labels/">Google｜生成广告披露</a></span></p><p><span class="tag">推断</span><b>实验二｜问题 Hook 对规格 Hook。</b>运行至预设事件样本量，保留同一落地页、受众、预算和频次；后验看订单、退款和新客，不以点击率宣布胜者。<span class="src">【来源】<a href="https://blog.google/products/ads-commerce/data-strength-updates/">Google｜因果证明</a></span></p><p><span class="tag">推断</span><b>实验三｜自动化试点设置人审闸门。</b>允许 agent 提议计划、预算或变体；人确认商品、目标、地域、品牌安全和上线，并记录建议—批准—结果链路。<span class="src">【来源】<a href="https://advertising.amazon.com/library/news/amazon-ads-agent">Amazon Ads｜agentic workflow</a>；<a href="https://newsroom.tiktok.com/tiktok-unveils-ai-powered-updates-for-advertisers-driving-discovery-action-and-measurable-business-outcomes-EU?lang=en-150">TikTok｜MCP workflow</a></span></p></section>
<section><h2>待验证线索</h2><p><span class="tag">事实</span><b>TikTok MCP 的市场、账户资格、价格和第三方实现边界仍需后台和产品文档核验。</b>公告只给出方向和目标；不能据此承诺客户已可采购或接入。<span class="src">【来源】<a href="https://newsroom.tiktok.com/tiktok-unveils-ai-powered-updates-for-advertisers-driving-discovery-action-and-measurable-business-outcomes-EU?lang=en-150">TikTok Newsroom｜2026-10-06</a></span></p><p><span class="tag">事实</span><b>Google 的 Conversational Discovery ads、Highlighted Answers 和 Direct Offers 仍属测试/试点。</b>应先核对地区、Merchant Center/结账集成、数据使用与品牌控制。<span class="src">【来源】<a href="https://blog.google/products/ads-commerce/google-marketing-live-search-ads/">Google｜新格式测试</a></span></p></section>
<section><h2>来源索引</h2><p>本期一手来源：TikTok Newsroom、Amazon Ads、Google Ads &amp; Commerce、MAM Baby UK。平台案例成效均在正文就地标注性质、口径和验证限制；未公开真实素材镜头不作推测。<span class="src">【来源】<a href="https://newsroom.tiktok.com/">TikTok Newsroom</a>；<a href="https://advertising.amazon.com/library/news/amazon-ads-agent">Amazon Ads Agent</a>；<a href="https://blog.google/products/ads-commerce/">Google Ads &amp; Commerce</a>；<a href="https://www.mambaby.com/gb/">MAM Baby UK</a></span></p></section></main></html>-->
