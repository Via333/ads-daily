<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>海外广告与新平台情报 - 2026-06-07</title>
</head>
<body>
  <p>正在加载 2026-06-07 简报...</p>
  <p><a href="../">如果页面没有自动打开，请点击这里查看简报。</a></p>
  <script>
    fetch('../index.html')
      .then(function (response) { return response.text(); })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        location.href = '../';
      });
  </script>
</body>
</html>
